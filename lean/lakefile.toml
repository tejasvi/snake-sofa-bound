name = "Sofa3D"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Sofa3D"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.style.header = false

# Upper bound 2*sqrt(2) for the three-dimensional sofa problem in a snake-shaped corridor.
# Toolchain leanprover/lean4:v4.35.0-rc3; Mathlib at tag v4.35.0-rc3 (commit c55e6e786f49, see lake-manifest.json).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "Sofa3D"
globs = ["Sofa3D", "Sofa3D.+"]
